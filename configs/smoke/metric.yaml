# Smoke config (metric): fixture datasets built by `python -m tests.fixtures_builder data/smoke`.
# Every key is required (spec §5.6). params = metric template with M-D27 smoke substitutions
# (weights null, input 64/56, small steps_per_epoch).
schema_version: '1'
protocol_version: '1'
profile: smoke
seeds:
  seed: 11
  seeds:
  - 11
datasets:
  kadid10k:
    dataset_id: kadid10k
    manifest_version: smoke-v1
    fixture: true
    categories: null
    n_validation: 2
    expected:
      originals: 6
      derivatives: 24
    provenance:
      source_url: https://database.mmsp-kn.de/kadid-10k-database.html
      archive_name: kadid10k.zip
      download_date: null
      license: see provider
      license_file: null
  hpatches:
    dataset_id: hpatches
    manifest_version: smoke-v1
    fixture: true
    categories: null
    n_validation: null
    expected:
      sequences: 10
    provenance:
      source_url: https://github.com/hpatches/hpatches-dataset
      archive_name: hpatches-sequences-release.tar.gz
      download_date: null
      license: see provider
      license_file: null
  mvtec_ad:
    dataset_id: mvtec_ad
    manifest_version: smoke-v1
    fixture: true
    categories:
    - carpet
    - leather
    - tile
    - wood
    n_validation: null
    expected:
      train_good: 32
      test_good: 8
      test_defect: 8
    provenance:
      source_url: https://www.mvtec.com/company/research/datasets/mvtec-ad
      archive_name: mvtec_anomaly_detection.tar.xz
      download_date: null
      license: CC BY-NC-SA 4.0
      license_file: null
  sop:
    dataset_id: sop
    manifest_version: smoke-v1
    fixture: true
    categories: null
    n_validation: null
    expected:
      products: 14
      train_images: 30
      test_images: 12
    provenance:
      source_url: https://cvgl.stanford.edu/projects/lifted_struct/
      archive_name: Stanford_Online_Products.zip
      download_date: null
      license: see provider
      license_file: null
inputs:
  pair_columns:
  - pair_id
  - query_id
  - reference_id
  - relation_id
  color_order: bgr
data_modes:
  oracle:
    enabled: false
    reason: null
algorithms:
  proxy_cal: proxy_cos_softmax_v1
params:
  model:
    backbone: resnet50
    weights: null
    weights_sha256: 66c8b43daff3fcc15bc4f30e3d2a167e21a14d9c9598a5394e5516471f4af504
    embedding_dim: 128
    bn_mode: frozen_stats_trainable_affine
  input:
    resize_short: 64
    crop: 56
    train_augment: true
    flip_p: 0.5
    normalize_l2: true
  batch:
    classes: 16
    per_class: 2
  optimizer:
    name: adam
    lr: 0.0001
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-07
  train:
    epochs: 40
    steps_per_epoch: 4
    precision: fp32
  proxy:
    kappa: 16
    init: normal_then_normalize
    eps_p: 1.0e-12
  embed:
    eps_z: 1.0e-12
  calibration:
    lambda: 0.0
    queues: true
    K: 32
    n_warm: 4
  queue:
    check_every: 1000
    sum_tol: 1.0e-06
  loss:
    margin: null
  data:
    class_subset: null
    per_class_limit: null
    cohort_min_images: null
  checkpoint:
    every_steps: null
  search:
    block_q: 1024
    block_g: 8192
    k:
    - 1
    - 5
    - 10
    d2_tol: 1.0e-06
  pairs:
    max_pos_per_class: 20
    max_attempts: 100
  threshold:
    criterion_id: max_recall_at_fpr_le_0.05
    fpr_max: 0.05
  degradation: none
decision:
  tie_rule: '>='
  criterion_id: null
determinism:
  deterministic_ops: true
  opencv_threads: 1
  numpy_threads: 1
runner:
  chunk_size: 256
logging:
  level: INFO
  dir: logs
paths:
  data_root: data/smoke
  manifest_dir: data/smoke/manifests
  out_root: out
